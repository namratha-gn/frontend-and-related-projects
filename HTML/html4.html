<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMS</title>
</head>
<body>
   <form action="/action.php">
        <div>
            <label for="user_name">Enter the Name</label>
            <input type="text" id="user_name" placeholder="username">
        </div>
        <div>
            <label for="AgE">Enter the age</label>
            <input type="number" id="AgE" placeholder="Age">
        </div>
        <div>
            <label for="Pass_word">Enter the Password</label>
            <input type="password" id="Pass_word" placeholder="password">
        </div>
        <button>submit</button> <!--No matter what the text that you are entering inside the button tag , fater pressing it in the web page it just submitt the data that you entered to the action location-->
        <button>Hello</button> <!--button tag should be inside the form tag not outside  , if so the it won't work on the web page-->
    
        <!--Buttons in html /forms-->
        <button type="submit">submit the data</button>
        <button type="button">Hello</button>
        <button type="reset">reset</button>


    </form> 
</body>
</html>
