<!--Write the html code by typing the "!" 
set the proper indentation (Spacing)
Write the title inside the head tag
write the different tags or content that need to be there on the web page inside the body tag-->



<!DOCTYPE html>     <!--it specifies HTML 5 version-->
<html lang="en">    <!--language using here(instead you can you kannada or other languages too) and starting of html tag-->
  <head>            <!--Starting of head tag-->
    <meta charset="UTF-8">      <!--Metadata-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--content written inside the  head tag will not appear inside the web page-->
    <title>My first boilerplate code of html</title> <!--Title tag that appears on the top bar will not appear on the web page-->
  </head>           <!--Ending of head tag-->
  <body>            <!--Starting of body tag-->
    <p>Hello Namratha</p>  <!--paragraph tag inside the body tag (content of body tag apperas on the web page)-->
  </body>           <!--Ending of body tag-->
</html>             <!--Ending of html tag-->

<!--LISTS IN HTML--> 

<!--There will be 2 kinds of lists 
1.unordered list(<ul>)=unordered list is specified as dot(.)[not in sequence]
2.Ordered lsit(<ol>)=ordered list is specified as 1,2,3.... or a,b,c,d....[will be in sequence] 
  
Whether it is ordered list or unordered list,after specifying it you need too specify the items inside that list items(<li>)-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists in HTML</title>  <!--mentioning the title-->
  </head>
  <body>
    <ul>  <!--inside the body tag writing the unordered list tag and list items tag-->
      <li>Bread</li>                               
      <li>jam<b>cream</b></li>             <!--paragraph tag or heading tags inside the list items tags--> <!--2 times nested tags-->
      <li>Biscuits</li>                     <!--See the diff bw nestinng bold tag or another html tags-->
    </ul>

    <ul>
      <li>Namratha<h2>Nagaraj</h2></li>     <!--Think about the outcome of writing the html tags like paragraph ,heading,bold inside the list items tags-->
      <li>Nagaraj</li>
      <li>Bhuvan</li>
    </ul>

    <ol Type="a">                           <!--Attribute called type we use in ordered list-->
      <li>Dedication </li>
      <li>Hard work</li>
      <li>consistancy<p>pays off</p></li>  <!--nested tags-->  <!--output will be comnsecutive nad in sequence manner-->              
    </ol>                                   <!--See the diff bw nestinng bold tag or another html tags-->
  
  </body>
</html>
