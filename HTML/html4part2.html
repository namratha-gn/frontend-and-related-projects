<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Forms in html</title>
    </head>
    <body>
        <form action="/action.php"> <!--Starting of form tag and link to where the data should store and the action performing the data is going to be in the form of Name-value pair with the link-->
            <label for="name">Username</label>
            <br> <!--For attribute is for linking label and input box nad 'username is the name given to the label'-->
            <input type="text" id="name" placeholder="username" name="Username">
            <br> <!-- we are using 3 attributes here id is for linking the input to the label name attribute if for sending the data for the location through the link connected by the name-value pair-->
            <button type="submit">submit</button>
            &nbsp; <!--There are 3 types of button that we can use namely submit,button,reset-->
            <button type="reset">reset</button><!--You just think about the example of searching something the youtube or browser and notice the link where the youtube search bar is also a kind of input that you are giving-->
        </form>

        
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdowns using select element</title>
</head>
<body>
    <!--Dropdown (select element) concept-->
    <form action="/server">
    <div><label for="city">Select the city</label> <!--I am using label here-->
    <br>
    <select name="city" id="city">
        <option value="cbp">Chikkaballapur</option>
        <option value="bang">Bangalore</option>
        <option value="hybd">Hyderabad</option>
    </select>
    <br>
    <button type="submit">submit</button>
    </div>

    <select name="flavour" id="fla">  <!--I am writing the code without the label tag-->
        <option>Select the flavour</option> <!--without label i am indicating the label inside the dropdown only whih apperes at the top-->
        <option value="chaco">Chocolate</option>
        <option value="veni" selected>venilla</option> <!--I am using selected option here (optional)-->
        <option value="red">Red velvet</option>
    </select>
    <button type="submit">Submit</button>


    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Range in forms</title>
    </head>
    <body>
        <form action="/server"> <!--Range concept-->
            <label for="vol">Select the volume level</label>
            <input type="range" id="vol" step="20" name="volume" min="0" max="500" value="50"> <!--this are the 7 attributes of input in range concept-->
            <button type="submit">submit</button>
        </form>
    </body>
</html>
