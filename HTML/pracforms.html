<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Practice Question on forms</title>
    </head>
    <body>
        <h1>Registration Form</h1>
        <form action="/server" >
            <div>
                <input type="text" placeholder="First Name" name="fname">
                <input type="text" placeholder="Last Name" name="lname" >
            </div>
            <div>
                <label for="form">Please select gender</label>
                <select type="text" id="form" name="gender">
                    <option value="male" selected>Male</option>
                    <option value="female">Female</option>
                    <option value="others">others</option>
                </select>
            </div>
            <div>
                Do you agree to all terms of service?
                <input type="checkbox" id="tick" checked name="terms" value="yess">
                <label for="tick">Yes,I agree</label>
            </div>
            <button type="submit">Register</button>
                

        </form>
        
    </body>
</html>
